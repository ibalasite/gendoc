<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>API Explorer — Postman-Style Sandbox</title>
<style>
:root {
  --bg: #1e1e2e;
  --surface: #2a2a3e;
  --border: #3a3a5e;
  --text: #cdd6f4;
  --text-dim: #7f849c;
  --primary: #89b4fa;
  --success: #a6e3a1;
  --error: #f38ba8;
  --warning: #fab387;
  --method-get: #a6e3a1;
  --method-post: #89b4fa;
  --method-put: #f9e2af;
  --method-patch: #cba6f7;
  --method-delete: #f38ba8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

/* ── Top Nav ────────────────────────────────────── */
.top-nav { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 600; font-size: 14px; }
.nav-link { margin-left: auto; color: var(--primary); text-decoration: none; font-size: 12px; }

/* ── Layout ─────────────────────────────────────── */
.layout { display: flex; height: calc(100vh - 41px); }
.sidebar { width: 240px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); flex-shrink: 0; }
.search-input { width: 100%; padding: 8px 12px; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); outline: none; font-size: 12px; }
.ep-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.05); }
.ep-item:hover { background: rgba(255,255,255,.05); }
.ep-item.active { background: rgba(137,180,250,.1); }
.main-panel { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Method Badge ────────────────────────────────── */
.method-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .5px; }
.method-GET    { background: rgba(166,227,161,.2); color: var(--method-get); }
.method-POST   { background: rgba(137,180,250,.2); color: var(--method-post); }
.method-PUT    { background: rgba(249,226,175,.2); color: var(--method-put); }
.method-PATCH  { background: rgba(203,166,247,.2); color: var(--method-patch); }
.method-DELETE { background: rgba(243,139,168,.2); color: var(--method-delete); }

/* ── Endpoint Panel ──────────────────────────────── */
.ep-panel { max-width: 860px; }
.ep-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ep-path { font-size: 16px; font-weight: 600; }
.ep-summary { color: var(--text-dim); font-size: 13px; }
.auth-badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: rgba(250,179,135,.15); color: var(--warning); margin-left: auto; }
.ep-desc { color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }

/* ── Postman Request Bar ─────────────────────────── */
.postman-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 0; }
.url-preview { flex: 1; font-family: monospace; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.send-btn { padding: 6px 18px; background: var(--primary); color: #11111b; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }
.send-btn:hover:not(:disabled) { opacity: .9; }

/* ── Request Tabs ────────────────────────────────── */
.req-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
.tab-btn { padding: 8px 14px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); cursor: pointer; font-size: 13px; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.req-tab-content { padding: 12px 0; }
.req-tab-content.hidden { display: none; }

/* ── Param Grid ──────────────────────────────────── */
.param-grid { width: 100%; border-collapse: collapse; }
.param-grid th { text-align: left; font-size: 11px; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .5px; }
.param-grid td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; }
.param-grid tr.required .pname { color: var(--text); font-weight: 500; }
.param-grid tr.optional .pname { color: var(--text-dim); }
.req-star { color: var(--error); margin-left: 2px; }
.param-grid input { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 12px; width: 180px; outline: none; }
.param-grid input:focus { border-color: var(--primary); }
.ptype { font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,.05); padding: 2px 6px; border-radius: 3px; }
.pdesc { color: var(--text-dim); font-size: 12px; }
.enum-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(137,180,250,.15); color: var(--primary); cursor: pointer; border: 1px solid rgba(137,180,250,.3); }
.chip:hover { background: rgba(137,180,250,.3); }

/* ── Auth Section ────────────────────────────────── */
.auth-section { padding: 8px 0; }
.auth-section label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; display: block; }
.auth-row { display: flex; gap: 8px; align-items: center; }
.auth-row input { flex: 1; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; color: var(--text); font-size: 13px; outline: none; }
.auth-row input:focus { border-color: var(--primary); }
.auth-row button { background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; padding: 6px 10px; }
.auth-note { font-size: 12px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── Headers Grid ────────────────────────────────── */
.headers-grid { width: 100%; border-collapse: collapse; }
.headers-grid th { font-size: 11px; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.headers-grid td { padding: 4px 8px; }
.headers-grid input[type="text"], .headers-grid input:not([type]) { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 12px; width: 200px; outline: none; }
.add-header-btn { margin-top: 8px; background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; padding: 4px 12px; font-size: 12px; }

/* ── Body Editor ─────────────────────────────────── */
.body-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.body-type-badge { font-size: 11px; padding: 2px 8px; background: rgba(255,255,255,.07); border-radius: 3px; color: var(--text-dim); }
.body-toolbar button { background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; padding: 3px 10px; font-size: 12px; }
.body-editor { width: 100%; height: 160px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px; color: var(--text); font-family: monospace; font-size: 12px; resize: vertical; outline: none; }
.body-editor:focus { border-color: var(--primary); }
.body-editor.invalid { border-color: var(--error); }
.json-error { font-size: 12px; color: var(--error); margin-top: 4px; }
.json-error.hidden { display: none; }

/* ── Response Panel ──────────────────────────────── */
.resp-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-top: 14px; overflow: hidden; }
.resp-topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.resp-status-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 4px; }
.status-2xx { background: rgba(166,227,161,.2); color: var(--success); }
.status-4xx { background: rgba(243,139,168,.2); color: var(--error); }
.status-5xx { background: rgba(243,139,168,.3); color: var(--error); }
.resp-time { font-size: 12px; color: var(--text-dim); }
.resp-view-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.resp-view-toggle button { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 3px 10px; font-size: 12px; }
.resp-view-toggle button.active { background: rgba(137,180,250,.2); color: var(--primary); }
.copy-resp-btn { margin-left: auto; background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; padding: 3px 10px; font-size: 12px; }
.resp-body { padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; overflow: auto; max-height: 320px; color: var(--text); }

/* ── Possible Responses ──────────────────────────── */
.possible-responses { margin-top: 14px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.possible-responses > summary { padding: 8px 12px; cursor: pointer; color: var(--text-dim); font-size: 12px; background: var(--surface); }
.resp-item { border-top: 1px solid var(--border); }
.resp-item > summary { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
.status-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: rgba(255,255,255,.08); }
.resp-example-block { padding: 0 12px 10px; }
.resp-example-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; color: var(--text-dim); }
.resp-example-header button { background: transparent; border: 1px solid var(--border); border-radius: 3px; color: var(--text-dim); cursor: pointer; padding: 2px 8px; font-size: 11px; }
.resp-example-block pre { font-family: monospace; font-size: 12px; white-space: pre-wrap; color: var(--text); }

/* ── Test Result ─────────────────────────────────── */
.test-result { font-size: 12px; font-weight: 600; margin-top: 6px; }
</style>
</head>
<body>
<header class="top-nav">
  <span class="brand">API Explorer — Postman-Style Sandbox</span>
  <a class="nav-link" href="#">← 文件站</a>
</header>

<div class="layout">
  <nav class="sidebar">
    <input class="search-input" placeholder="搜尋 endpoint..." oninput="filterEndpoints(this.value)">
    <div id="endpoint-list"></div>
  </nav>
  <main class="main-panel" id="main-panel">
    <div class="welcome-state" style="color:var(--text-dim);padding:40px 0;">
      <h2 style="margin-bottom:8px;">選擇左側 Endpoint 開始試打</h2>
      <p>所有回應均為 JavaScript Mock — 無需啟動後端服務</p>
    </div>
  </main>
</div>

<script>
// ── SPEC（Iron Law A 結構）────────────────────────────────────────
const SPEC = {
  base_url: "https://api.example.com",
  auth: { type: "bearer", header: "Authorization", placeholder: "Bearer <token>" },
  groups: [{
    id: "users",
    name: "Users",
    color: "#89b4fa",
    endpoints: [
      {
        id: "list-users",
        method: "GET",
        path: "/users",
        summary: "列出使用者",
        description: "依條件查詢使用者列表，支援狀態篩選與分頁。",
        auth_required: true,
        mock_entity: "users",
        params: [
          { name: "status", in: "query", type: "string", required: false, description: "狀態篩選", default: "active",
            enum: ["active", "inactive", "suspended"] },
          { name: "page",   in: "query", type: "number", required: false, description: "頁碼", default: "1" },
          { name: "limit",  in: "query", type: "number", required: false, description: "每頁筆數", default: "10" }
        ],
        request_body: null,
        responses: [
          { code: 200, description: "成功",
            example: { data: [{ id:"u-001", name:"Alice", status:"active" },{ id:"u-002", name:"Bob", status:"inactive" }], total: 2, page: 1 } },
          { code: 401, description: "未授權",
            example: { error: "unauthorized", message: "Missing or invalid token" } }
        ]
      },
      {
        id: "get-user",
        method: "GET",
        path: "/users/{user_id}",
        summary: "取得使用者",
        description: "根據 user_id 取得單一使用者的詳細資訊。",
        auth_required: false,
        mock_entity: "users",
        params: [
          { name: "user_id", in: "path",  type: "string", required: true,  description: "使用者 ID", default: "u-001" },
          { name: "status",  in: "query", type: "string", required: false, description: "狀態篩選", default: "active",
            enum: ["active", "inactive", "suspended"] }
        ],
        request_body: null,
        responses: [
          { code: 200, description: "成功",
            example: { id: "u-001", name: "Alice", status: "active", created_at: "2026-01-01" } },
          { code: 404, description: "找不到",
            example: { error: "not_found", message: "User u-001 not found" } }
        ]
      },
      {
        id: "create-user",
        method: "POST",
        path: "/users",
        summary: "建立使用者",
        description: "建立新的使用者帳號。",
        auth_required: true,
        mock_entity: "users",
        params: [],
        request_body: { name: "Charlie", email: "charlie@example.com", role: "member" },
        responses: [
          { code: 201, description: "建立成功",
            example: { id: "u-003", name: "Charlie", email: "charlie@example.com", role: "member", created_at: "2026-05-18" } },
          { code: 400, description: "驗證失敗",
            example: { error: "validation_error", message: "email is required" } },
          { code: 401, description: "未授權",
            example: { error: "unauthorized", message: "Missing or invalid token" } }
        ]
      }
    ]
  }]
};

// ── MOCK_DB（Iron Law F：≥3 筆，涵蓋不同狀態）────────────────────
const MOCK_DB = {
  users: [
    { id: "u-001", name: "Alice",   email: "alice@example.com",   status: "active",    role: "admin",  created_at: "2026-01-01" },
    { id: "u-002", name: "Bob",     email: "bob@example.com",     status: "inactive",  role: "member", created_at: "2026-01-15" },
    { id: "u-003", name: "Charlie", email: "charlie@example.com", status: "suspended", role: "member", created_at: "2026-02-01" }
  ]
};

// ── 工具函式 ────────────────────────────────────────────────────
function findEndpoint(epId) {
  for (const g of SPEC.groups)
    for (const ep of g.endpoints)
      if (ep.id === epId) return ep;
  return null;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Auth 持久化 ────────────────────────────────────────────────
function saveAuth(token) { localStorage.setItem('api-explorer-token', token); }
function loadAuth() { return localStorage.getItem('api-explorer-token') || ''; }

// ── Tab 切換 ───────────────────────────────────────────────────
function switchTab(epId, tab, btn) {
  document.querySelectorAll(`[id^="tab-"][id$="-${epId}"]`).forEach(el => el.classList.add('hidden'));
  const panel = document.getElementById(`ep-panel-${epId}`);
  if (panel) panel.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const content = document.getElementById(`tab-${tab}-${epId}`);
  if (content) content.classList.remove('hidden');
  if (btn) btn.classList.add('active');
}

// ── URL Preview 即時更新（Iron Law D）─────────────────────────
function updateUrlPreview(epId) {
  const ep = findEndpoint(epId);
  if (!ep) return;
  let url = (SPEC.base_url || '') + ep.path;
  ep.params.filter(p => p.in === 'path').forEach(p => {
    const v = document.getElementById(`param-${epId}-${p.name}`)?.value;
    if (v) url = url.replace(`{${p.name}}`, v);
  });
  const qs = ep.params.filter(p => p.in === 'query')
    .map(p => { const v = document.getElementById(`param-${epId}-${p.name}`)?.value; return v ? `${p.name}=${encodeURIComponent(v)}` : null; })
    .filter(Boolean).join('&');
  if (qs) url += '?' + qs;
  const el = document.getElementById(`url-preview-${epId}`);
  if (el) el.textContent = url;
}

// ── Enum Chips（Iron Law E）───────────────────────────────────
function fillParam(epId, name, val) {
  const el = document.getElementById(`param-${epId}-${name}`);
  if (el) { el.value = val; updateUrlPreview(epId); }
}

// ── toggleAuthVis ─────────────────────────────────────────────
function toggleAuthVis(epId) {
  const el = document.getElementById(`auth-token-${epId}`);
  if (el) el.type = el.type === 'password' ? 'text' : 'password';
}

// ── addHeaderRow ──────────────────────────────────────────────
function addHeaderRow(epId) {
  const tbody = document.getElementById(`headers-body-${epId}`);
  if (!tbody) return;
  const tr = document.createElement('tr');
  tr.innerHTML = '<td><input type="checkbox" checked></td><td><input placeholder="Key" style="width:180px"></td><td><input placeholder="Value" style="width:200px"></td>';
  tbody.appendChild(tr);
}

// ── Body tab helpers ──────────────────────────────────────────
function formatBody(epId) {
  const el = document.getElementById(`body-textarea-${epId}`);
  if (!el) return;
  try { el.value = JSON.stringify(JSON.parse(el.value), null, 2); el.classList.remove('invalid'); }
  catch(e) { el.classList.add('invalid'); }
}
function resetBody(epId) {
  const ep = findEndpoint(epId);
  const el = document.getElementById(`body-textarea-${epId}`);
  if (ep && el) el.value = JSON.stringify(ep.request_body || {}, null, 2);
}
function validateJson(textarea, epId) {
  const errEl = document.getElementById(`body-error-${epId}`);
  try {
    JSON.parse(textarea.value);
    textarea.classList.remove('invalid');
    if (errEl) { errEl.textContent = ''; errEl.classList.add('hidden'); }
  } catch(e) {
    textarea.classList.add('invalid');
    if (errEl) { errEl.textContent = `JSON Error: ${e.message}`; errEl.classList.remove('hidden'); }
  }
}

// ── Response panel helpers ────────────────────────────────────
function setRespView(epId, view, btn) {
  const panel = document.getElementById(`ep-panel-${epId}`);
  if (panel) panel.querySelectorAll('.resp-view-toggle button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const pre = document.getElementById(`resp-body-${epId}`);
  if (!pre || !pre._data) return;
  pre.textContent = view === 'pretty' ? JSON.stringify(pre._data, null, 2) : JSON.stringify(pre._data);
}
function copyResp(epId) {
  const pre = document.getElementById(`resp-body-${epId}`);
  if (pre) navigator.clipboard.writeText(pre.textContent).catch(() => {});
}

// ── copyCode（Iron Law：data-copy attribute）──────────────────
function copyCode(btn, text) {
  navigator.clipboard.writeText(text).catch(() => {});
  const orig = btn.textContent;
  btn.textContent = '✓';
  setTimeout(() => btn.textContent = orig, 1200);
}

// ── Mock Engine ───────────────────────────────────────────────
function buildMockResponse(ep, params, body, token) {
  // Auth gate（Iron Law）
  if (ep.auth_required && !token) {
    return { code: 401, description: 'Unauthorized', body: { error: 'unauthorized', message: 'Missing or invalid token' } };
  }

  if (ep.method === 'GET') {
    if (ep.path.includes('{')) {
      // Single entity by path param
      const idParam = ep.params.find(p => p.in === 'path');
      const id = idParam ? params[idParam.name] : null;
      const entity = id ? (MOCK_DB[ep.mock_entity] || []).find(e => e.id === id) : null;
      if (!entity) return { code: 404, description: 'Not Found', body: { error: 'not_found', message: `${ep.mock_entity} ${id} not found` } };
      return { code: 200, description: 'OK', body: entity };
    } else {
      // List
      let list = [...(MOCK_DB[ep.mock_entity] || [])];
      const statusFilter = params.status;
      if (statusFilter) list = list.filter(e => e.status === statusFilter);
      const page = parseInt(params.page || '1');
      const limit = parseInt(params.limit || '10');
      const start = (page - 1) * limit;
      return { code: 200, description: 'OK', body: { data: list.slice(start, start + limit), total: list.length, page } };
    }
  }

  if (ep.method === 'POST') {
    const newItem = { id: `u-${Date.now()}`, ...(body || {}), created_at: new Date().toISOString().slice(0, 10) };
    return { code: 201, description: 'Created', body: newItem };
  }

  // fallback
  const ok = (ep.responses || []).find(r => r.code >= 200 && r.code < 300);
  return ok ? { code: ok.code, description: ok.description, body: ok.example } : { code: 200, description: 'OK', body: {} };
}

function mockRequest(epId, params, body, token) {
  const ep = findEndpoint(epId);
  return new Promise(resolve => {
    const start = Date.now();
    setTimeout(() => resolve({ response: buildMockResponse(ep, params, body, token), elapsed: Date.now() - start }), 250 + Math.random() * 150);
  });
}

// ── ▶ Send（Iron Law G：讀取三個 tab）────────────────────────
function runTry(epId, btn) {
  const ep = findEndpoint(epId);
  if (!ep) return;
  btn.disabled = true;
  btn.textContent = '⏳ 執行中…';

  // Step 1：Params tab
  const inputVals = {};
  ep.params.forEach(p => {
    const el = document.getElementById(`param-${epId}-${p.name}`);
    inputVals[p.name] = el ? el.value : (p.default ?? '');
  });

  // Step 2：Authorization tab
  const tokenEl = document.getElementById(`auth-token-${epId}`);
  const token = (tokenEl ? tokenEl.value.trim() : '') || loadAuth();

  // Step 3：Body tab
  let body = null;
  const bodyEl = document.getElementById(`body-textarea-${epId}`);
  if (bodyEl) { try { body = JSON.parse(bodyEl.value); } catch(e) {} }

  mockRequest(epId, inputVals, body, token).then(({ response, elapsed }) => {
    btn.disabled = false;
    btn.textContent = '▶ Send';

    // Step 4：Response Panel
    const panel = document.getElementById(`resp-panel-${epId}`);
    if (panel) panel.style.display = 'block';

    const statusEl = document.getElementById(`resp-status-${epId}`);
    if (statusEl) {
      statusEl.textContent = `${response.code} ${response.description || ''}`;
      statusEl.className = `resp-status-badge status-${Math.floor(response.code / 100)}xx`;
    }
    const timeEl = document.getElementById(`resp-time-${epId}`);
    if (timeEl) timeEl.textContent = `${elapsed}ms`;

    const bodyOutEl = document.getElementById(`resp-body-${epId}`);
    if (bodyOutEl) {
      bodyOutEl._data = response.body;
      bodyOutEl.textContent = JSON.stringify(response.body, null, 2);
    }

    // Playwright 驗證 hook
    document.body.setAttribute('data-test-result', 'pass');
    document.body.setAttribute('data-test-epid', epId);
    document.body.setAttribute('data-test-status', String(response.code));
  });
}

// ── renderEndpoint（Postman 風格）─────────────────────────────
function renderEndpoint(epId) {
  location.hash = 'endpoint-' + epId;
  const ep = findEndpoint(epId);
  if (!ep) return;

  document.querySelectorAll('.ep-item').forEach(el => el.classList.toggle('active', el.dataset.id === epId));

  const hasBody = ['POST','PUT','PATCH','DELETE'].includes(ep.method);
  const bodyTab = hasBody ? `<button class="tab-btn" onclick="switchTab('${epId}','body',this)">Body</button>` : '';

  const paramsRows = ep.params.map(p => {
    const chips = (p.enum || []).map(v => `<span class="chip" onclick="fillParam('${epId}','${p.name}','${escapeHtml(v)}')">${escapeHtml(v)}</span>`).join('');
    return `<tr class="${p.required ? 'required' : 'optional'}">
      <td><span class="pname">${escapeHtml(p.name)}</span>${p.required ? '<span class="req-star">*</span>' : ''}</td>
      <td>
        <input id="param-${epId}-${p.name}" value="${escapeHtml(p.default ?? '')}" placeholder="${escapeHtml(p.default || p.description || '')}" onkeyup="updateUrlPreview('${epId}')">
        ${chips ? `<div class="enum-chips">${chips}</div>` : ''}
      </td>
      <td><code class="ptype">${escapeHtml(p.in)}</code></td>
      <td class="pdesc">${escapeHtml(p.description || '')}</td>
    </tr>`;
  }).join('');

  const authToken = loadAuth();
  const authHeaderRow = ep.auth_required ? `
    <tr>
      <td><input type="checkbox" checked></td>
      <td><input style="width:180px" value="Authorization" readonly></td>
      <td><input id="auth-header-${epId}" style="width:200px" placeholder="Bearer &lt;token&gt;" value="${authToken ? 'Bearer ' + authToken : ''}"></td>
    </tr>` : '';

  const bodyTabContent = hasBody ? `
    <div class="req-tab-content hidden" id="tab-body-${epId}">
      <div class="body-toolbar">
        <span class="body-type-badge">raw JSON</span>
        <button onclick="formatBody('${epId}')">Format</button>
        <button onclick="resetBody('${epId}')">Reset</button>
      </div>
      <textarea class="body-editor" id="body-textarea-${epId}" spellcheck="false"
                oninput="validateJson(this,'${epId}')">${JSON.stringify(ep.request_body || {}, null, 2)}</textarea>
      <div class="json-error hidden" id="body-error-${epId}"></div>
    </div>` : '';

  const possibleResponses = ep.responses.map(r => {
    const plain = JSON.stringify(r.example || {}, null, 2);
    return `<details class="resp-item">
      <summary>
        <span class="status-badge">${r.code}</span> ${escapeHtml(r.description || '')}
      </summary>
      <div class="resp-example-block">
        <div class="resp-example-header">
          <span>JSON</span>
          <button data-copy="${plain.replace(/"/g, '&quot;')}" onclick="copyCode(this,this.dataset.copy)">複製</button>
        </div>
        <pre>${escapeHtml(plain)}</pre>
      </div>
    </details>`;
  }).join('');

  const html = `
    <div class="ep-panel" id="ep-panel-${epId}">
      <div class="ep-header">
        <span class="method-badge method-${ep.method}">${ep.method}</span>
        <code class="ep-path">${escapeHtml(ep.path)}</code>
        <span class="ep-summary">${escapeHtml(ep.summary || '')}</span>
        ${ep.auth_required ? '<span class="auth-badge">🔒 Bearer</span>' : ''}
      </div>
      <p class="ep-desc">${escapeHtml(ep.description || '')}</p>

      <div class="postman-bar">
        <span class="method-badge method-${ep.method}">${ep.method}</span>
        <div class="url-preview" id="url-preview-${epId}">${escapeHtml((SPEC.base_url||'') + ep.path)}</div>
        <button class="send-btn" onclick="runTry('${epId}', this)">▶ Send</button>
      </div>

      <div class="req-tabs">
        <button class="tab-btn active" onclick="switchTab('${epId}','params',this)">Params${ep.params.length ? ` (${ep.params.length})` : ''}</button>
        <button class="tab-btn" onclick="switchTab('${epId}','auth',this)">Authorization</button>
        <button class="tab-btn" onclick="switchTab('${epId}','headers',this)">Headers</button>
        ${bodyTab}
      </div>

      <div class="req-tab-content" id="tab-params-${epId}">
        <table class="param-grid">
          <thead><tr><th>KEY</th><th>VALUE</th><th>TYPE</th><th>DESC</th></tr></thead>
          <tbody>${paramsRows}</tbody>
        </table>
      </div>

      <div class="req-tab-content hidden" id="tab-auth-${epId}">
        <div class="auth-section">
          <label>Type: Bearer Token</label>
          <div class="auth-row">
            <input id="auth-token-${epId}" type="password"
                   placeholder="${escapeHtml(SPEC.auth.placeholder || 'Bearer <token>')}"
                   value="${escapeHtml(authToken)}"
                   oninput="saveAuth(this.value)">
            <button onclick="toggleAuthVis('${epId}')">👁</button>
          </div>
          ${!ep.auth_required ? '<p class="auth-note">此端點為公開端點，無需 Token</p>' : ''}
        </div>
      </div>

      <div class="req-tab-content hidden" id="tab-headers-${epId}">
        <table class="headers-grid">
          <thead><tr><th></th><th>KEY</th><th>VALUE</th></tr></thead>
          <tbody id="headers-body-${epId}">
            <tr>
              <td><input type="checkbox" checked></td>
              <td><input style="width:180px" value="Content-Type"></td>
              <td><input style="width:200px" value="application/json"></td>
            </tr>
            ${authHeaderRow}
          </tbody>
        </table>
        <button class="add-header-btn" onclick="addHeaderRow('${epId}')">+ Add</button>
      </div>

      ${bodyTabContent}

      <div class="resp-panel" id="resp-panel-${epId}" style="display:none">
        <div class="resp-topbar">
          <span class="resp-status-badge" id="resp-status-${epId}"></span>
          <span class="resp-time" id="resp-time-${epId}"></span>
          <div class="resp-view-toggle">
            <button class="active" onclick="setRespView('${epId}','pretty',this)">Pretty</button>
            <button onclick="setRespView('${epId}','raw',this)">Raw</button>
          </div>
          <button class="copy-resp-btn" onclick="copyResp('${epId}')">Copy</button>
        </div>
        <pre class="resp-body" id="resp-body-${epId}"></pre>
      </div>

      <details class="possible-responses">
        <summary>Possible Responses</summary>
        ${possibleResponses}
      </details>
    </div>`;

  document.getElementById('main-panel').innerHTML = html;
  updateUrlPreview(epId);
}

// ── Sidebar ────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('endpoint-list');
  list.innerHTML = SPEC.groups.map(g => `
    <div style="padding:6px 12px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;">${escapeHtml(g.name)}</div>
    ${g.endpoints.map(ep => `
      <div class="ep-item" data-id="${ep.id}" onclick="renderEndpoint('${ep.id}')">
        <span class="method-badge method-${ep.method}">${ep.method}</span>
        <span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ep.path)}</span>
      </div>`).join('')}
  `).join('');
}

function filterEndpoints(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.ep-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(lq) ? '' : 'none';
  });
}

// ── Init ───────────────────────────────────────────────────────
renderSidebar();
const initHash = location.hash.slice(1);
if (initHash.startsWith('endpoint-')) {
  renderEndpoint(initHash.replace('endpoint-', ''));
} else {
  const first = SPEC.groups[0]?.endpoints[0];
  if (first) renderEndpoint(first.id);
}
</script>
</body>
</html>
